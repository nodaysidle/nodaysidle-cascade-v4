name: Checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  kits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Linux and Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - run: npm ci
      - name: Build every starter kit
        run: npm run kit:check
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        timeout-minutes: 60
